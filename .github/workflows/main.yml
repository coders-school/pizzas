name: CMake homework

on: [push, pull_request]

jobs:
  checker:
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@master
    - name: Run check.sh
      run: |
        chmod +x .github/scripts/check.sh
        sudo apt-get update && sudo apt-get install -y pcre2-utils
        .github/scripts/check.sh CMakeLists.txt
